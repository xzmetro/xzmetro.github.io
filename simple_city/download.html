<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/main.css">
    <link rel="icon" type="image/png" href="../static/images/favicon.png">
    <title id="dl-page-title">Simple City - Download</title>
</head>
<body>
<header>
    <div class="header-title">
        <img class="logo-img" src="../static/images/favicon.png" alt="Logo">
        <span id="site-name">Simple City</span>
    </div>
    <nav class="header-nav">
        <a href="index.html" id="nav-home">Home</a>
        <a href="download.html" id="nav-download">Download</a>
        <a href="https://github.com/xzmetro/simple_city/issues/" id="nav-issues">Issues</a>
        <a href="https://github.com/xzmetro/simple_city">GitHub</a>
        <a href="https://modrinth.com/mod/simple_city/">Modrinth</a>
        <a href="?lang=zh" id="lang-switch">简体中文</a>
    </nav>
</header>

<main class="download-page">
    <h1 id="download-title">Download Mod</h1>

    <div class="version-selector">
        <label for="version-select" id="version-label">Version:</label>
        <select id="version-select">
            <option value="" id="version-loading">Loading...</option>
        </select>
    </div>

    <div class="download-info" id="download-info">
        <div id="version-info">Select a version to download</div>
        <a href="#" class="download-btn" id="download-btn" style="display: none;">
            <span id="download-btn-text">Download</span>
        </a>
    </div>
</main>
<script src="../static/js/util.js"></script>
<script src="../static/js/lang.js"></script>
<script src="../static/js/maven.js"></script>
<script>
    const downloadMap = {
        'page-title': 'dlTitle',
        'site-name': 'siteName',
        'nav-home': 'navHome',
        'nav-download': 'navDownload',
        'nav-issues': 'navIssues',
        'nav-wiki': 'navWiki',
        'download-title': 'downloadTitle',
        'version-label': 'versionLabel',
        'version-loading': 'versionLoading',
        'version-info': 'versionInfo',
        'download-btn-text': 'downloadBtn',
    };
    document.addEventListener('DOMContentLoaded', async () => {
        initI18n(downloadMap);
        await initMaven();
    });
</script>
